
name: XAUUSD read-only candle snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * 1-5'
    - cron: '35 11 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xauusd-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch XAUUSD candles
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python fetch.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
