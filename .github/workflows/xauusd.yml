
name: XAUUSD read-only candle snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * 1-5'
    - cron: '35 11 * * 1-5'
    - cron: '10 12 * * 1-5' # 08:10 ET during daylight saving
    - cron: '10 13 * * 1-5' # 08:10 ET during standard time

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xauusd-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate post-London refresh by New York daylight time
        id: session_gate
        env:
          SCHEDULE_EVENT: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          ny = datetime.now(timezone.utc).astimezone(ZoneInfo("America/New_York"))
          scheduled = os.environ.get("SCHEDULE_EVENT", "")
          post_london = scheduled in ("10 12 * * 1-5", "10 13 * * 1-5")
          # Other scheduled runs and manual dispatch are always allowed.
          allowed = not post_london or ny.hour == 8
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("run=" + str(allowed).lower() + "\n")
          print("NY time:", ny.isoformat(), "| Run data collection:", allowed)
          PY

      - name: Fetch XAUUSD candles
        if: steps.session_gate.outputs.run == 'true'
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python -m py_compile fetch.py
          python fetch.py

      - name: Update derived report in repository
        if: steps.session_gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh derived XAUUSD market report"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
        if: steps.session_gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.session_gate.outputs.run == 'true'
        with:
          path: site

      - name: Publish site
        if: steps.session_gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
