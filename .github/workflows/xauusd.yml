name: XAUUSD read-only candle snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetch.py
      - live.py
      - render_site.py
      - .github/workflows/xauusd.yml
  schedule:
    - cron: '35 5 * * 1-5'        # Detailed 12:35 WIB
    - cron: '35 11 * * 1-5'       # Detailed 18:35 WIB
    - cron: '10 12 * * 1-5'       # Detailed post-London 08:10 ET (EDT)
    - cron: '10 13 * * 1-5'       # Detailed post-London 08:10 ET (EST)
    - cron: '7,22,37,52 * * 1-5' # Lightweight snapshot every 15 minutes, weekdays UTC
    - cron: '7,22,37,52 21-23 * * 0' # Near Sunday market reopening UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xauusd-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine snapshot mode and London daylight gate
        id: session_gate
        env:
          SCHEDULE_EVENT: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          ny = datetime.now(timezone.utc).astimezone(ZoneInfo("America/New_York"))
          scheduled = os.environ.get("SCHEDULE_EVENT", "")
          quick = scheduled in ("7,22,37,52 * * 1-5", "7,22,37,52 21-23 * * 0")
          post_london = scheduled in ("10 12 * * 1-5", "10 13 * * 1-5")
          allowed = not post_london or ny.hour == 8
          mode = "quick" if quick else "full"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("run=" + str(allowed).lower() + "\n")
              out.write("mode=" + mode + "\n")
          print("NY time:", ny.isoformat(), "| Mode:", mode, "| Collect:", allowed)
          PY

      - name: Check Python syntax
        if: steps.session_gate.outputs.run == 'true'
        run: python -m py_compile fetch.py live.py render_site.py

      - name: Fetch complete XAUUSD multi-timeframe report
        if: steps.session_gate.outputs.run == 'true' && steps.session_gate.outputs.mode == 'full'
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python fetch.py

      - name: Fetch lightweight quote and closed M5 report
        if: steps.session_gate.outputs.run == 'true' && steps.session_gate.outputs.mode == 'quick'
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python live.py

      - name: Build public read-only monitor
        if: steps.session_gate.outputs.run == 'true'
        run: python render_site.py

      - name: Update derived reports in repository
        if: steps.session_gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A derived
          if ! git diff --cached --quiet; then
            git commit -m "Refresh derived XAUUSD market report"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
        if: steps.session_gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.session_gate.outputs.run == 'true'
        with:
          path: site

      - name: Publish site
        if: steps.session_gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
