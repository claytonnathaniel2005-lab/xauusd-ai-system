name: XAUUSD near-live price and M5 monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - live.py
      - render_site.py
      - .github/workflows/xauusd-live.yml
  schedule:
    - cron: '7,22,37,52 * * * 1-5'       # Every 15 minutes on weekdays UTC
    - cron: '7,22,37,52 21-23 * * 0' # Sunday UTC at FX market reopening

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xauusd-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python source
        run: python -m py_compile fetch.py live.py render_site.py

      - name: Fetch latest quote and closed M5 candles
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python live.py

      - name: Build public near-live dashboard
        run: python render_site.py

      - name: Commit derived near-live study report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derived/live.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh derived near-live XAUUSD price and M5 report"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish near-live dashboard
        id: deployment
        uses: actions/deploy-pages@v4
