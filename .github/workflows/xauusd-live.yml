name: XAUUSD near-live price and M5 monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - live.py
      - render_site.py
      - .github/workflows/xauusd-live.yml
      - refresh-requests/quote-refresh.json # ChatGPT on-demand refresh trigger
  schedule:
    - cron: '2-59/5 4-16 * * 1-5'     # Every 5 minutes during 11:00-23:59 WIB weekdays
    - cron: '7,22,37,52 0-3,17-23 * * 1-5' # Every 15 minutes at other weekday hours
    - cron: '7,22,37,52 21-23 * * 0' # Sunday UTC at FX market reopening

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xauusd-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python source
        run: python -m py_compile fetch.py live.py render_site.py

      - name: Fetch latest quote and closed M1/M5 candles
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python live.py

      - name: Build public near-live dashboard
        run: python render_site.py

      - name: Commit derived near-live study report (retry safely on branch changes)
        run: |
          set -e
          cp derived/live.json "$RUNNER_TEMP/xauusd-live.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p derived
            cp "$RUNNER_TEMP/xauusd-live.json" derived/live.json
            git add derived/live.json
            if git diff --cached --quiet; then
              echo "Near-live report unchanged"
              break
            fi
            git commit -m "Refresh derived near-live XAUUSD M1/M5 report"
            if git push origin HEAD:main; then
              echo "Near-live report saved successfully"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to push after 5 attempts" >&2
              exit 1
            fi
            sleep 2
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish near-live dashboard
        id: deployment
        uses: actions/deploy-pages@v4
